; AutoIrrigation — ESP32-S3 + I2C expander daughterboard
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-irrigation

[common]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	bblanchon/ArduinoJson@^7.2.1

; ESP32-S3 + 0.96" SSD1306 128x64 I2C 状态屏 + 两个自复按钮
[env:esp32-s3-irrigation]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_S3_IRRIGATION
	-DBOARD_HAS_LVGL=0
	-DIRRIGATION_HAS_FLOW_METER=1
	-DIRRIGATION_HAS_VALVES=1
lib_deps =
	${common.lib_deps}
	makuna/NeoPixelBus@^2.8.4
	olikraus/U8g2@^2.36.5
	; lvgl/lvgl@^9.2.0  — 编码器三屏界面已停用；恢复时置 -DBOARD_HAS_LVGL=1
