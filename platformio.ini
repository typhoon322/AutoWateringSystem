; AutoIrrigation — I2C expander daughterboard (swap MCU only: C3 dev → S3 prod)
; https://docs.platformio.org/page/projectconf.html

[common]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	bblanchon/ArduinoJson@^7.2.1

; 前期验证：01Space ESP32-C3 0.42" OLED (C3FH4 4MB, I2C GPIO5/6)
[env:esp32-c3-oled-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = ${common.board_build.filesystem}
build_flags =
	-DBOARD_C3_OLED_TEST
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DIRRIGATION_HAS_FLOW_METER=0
	-DIRRIGATION_HAS_VALVES=0
lib_deps =
	${common.lib_deps}
	olikraus/U8g2@^2.36.5

; 量产 / 开发：ESP32-S3 开发板 + SH1106 128x64 I2C 屏（LVGL，暂不装屏时置 0）
[env:esp32-s3-irrigation]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = ${common.board_build.filesystem}
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_S3_IRRIGATION
	-DBOARD_HAS_LVGL=0
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
	-DIRRIGATION_HAS_FLOW_METER=1
	-DIRRIGATION_HAS_VALVES=1
lib_deps =
	${common.lib_deps}
	lvgl/lvgl@^9.2.0
